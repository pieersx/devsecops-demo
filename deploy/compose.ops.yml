services:
  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "3100:3100" # el security group solo lo abre a la VPS app
    volumes:
      - loki-data:/loki
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3000:3000" # solo local; se accede con un tunel SSM (port forwarding)
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - grafana-data:/var/lib/grafana
      - ./datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

secrets:
  grafana_admin_password:
    file: ./grafana_admin_password

volumes:
  loki-data:
  grafana-data:
