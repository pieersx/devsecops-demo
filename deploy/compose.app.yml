services:
  app:
    image: ${APP_IMAGE}
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    ports:
      - "8000:8000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Deteccion en runtime: alerta ante shells en contenedores, escrituras en /etc, etc.
  falco:
    image: falcosecurity/falco:0.45.2 # 0.39.x no inicia el sensor modern_ebpf en el kernel 7.0 de Ubuntu 26.04
    restart: unless-stopped
    privileged: true # requerido por Falco para cargar su sonda eBPF; aislado en esta VPS
    command: ["falco", "-o", "engine.kind=modern_ebpf", "-o", "json_output=true"]
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /etc:/host/etc:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Recolector de logs hacia Loki (VPS ops)
  alloy:
    image: grafana/alloy:v1.21.3
    restart: unless-stopped
    # Con cap_drop ALL el usuario por defecto no puede escribir en /var/lib/alloy.
    # Root sin capacidades + datos en tmpfs funciona; se pierden las posiciones de lectura al reiniciar.
    user: "0:0"
    command: ["run", "--storage.path=/tmp/alloy-data", "/etc/alloy/config.alloy"]
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro # riesgo conocido: lectura del socket; mitigable con un proxy de socket
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
