name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --redact --verbose

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Semgrep
        run: |
          docker run --rm -v "$PWD:/src" semgrep/semgrep:1.99.0 \
            semgrep scan --config p/python --config p/dockerfile --error --metrics=off /src/app

  iac:
    name: IaC y configuracion (Trivy + Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Trivy config (OpenTofu, Dockerfile, Compose)
        run: |
          docker run --rm -v "$PWD:/w" aquasec/trivy:0.58.1 \
            config --severity HIGH,CRITICAL --exit-code 1 --ignorefile /w/.trivyignore /w
      - name: Checkov (OpenTofu y Compose)
        run: |
          docker run --rm -v "$PWD:/w" bridgecrew/checkov:3.2.344 \
            --config-file /w/.checkov.yml

  deps:
    name: Dependencias vulnerables (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Trivy fs sobre requirements.txt
        run: |
          docker run --rm -v "$PWD:/w" aquasec/trivy:0.58.1 \
            fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /w/app

  build-scan:
    name: Build, escaneo de imagen y SBOM
    runs-on: ubuntu-latest
    needs: [secrets, sast, iac, deps]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build
        run: docker build -t devsecops-demo:ci app
      - name: Trivy imagen (falla con HIGH/CRITICAL corregibles)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1 image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 devsecops-demo:ci
      - name: SBOM CycloneDX
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" \
            aquasec/trivy:0.58.1 image --format cyclonedx --output /out/sbom.cdx.json devsecops-demo:ci
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  publish:
    name: Publicar y firmar (solo main)
    runs-on: ubuntu-latest
    needs: [build-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write # firma keyless con Sigstore
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@v3
      - name: Login en GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build, push y firma por digest
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --build-arg APP_VERSION="${GITHUB_SHA}" -t "$IMAGE:${GITHUB_SHA}" -t "$IMAGE:latest" app
          docker push "$IMAGE:${GITHUB_SHA}"
          # "latest" solo sirve para el primer arranque con Ansible; los despliegues usan siempre el digest firmado
          docker push "$IMAGE:latest"
          DIGEST_REF=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:${GITHUB_SHA}")
          cosign sign --yes "$DIGEST_REF"
          echo "Imagen firmada: $DIGEST_REF" >> "$GITHUB_STEP_SUMMARY"
