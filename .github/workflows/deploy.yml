name: deploy

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: "Imagen firmada por digest (ghcr.io/owner/repo@sha256:...). Ver el resumen del job publish."
        required: true

permissions:
  contents: read
  id-token: write # OIDC hacia AWS y verificacion Sigstore

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: demo # permite exigir aprobacion manual en GitHub
    steps:
      - uses: sigstore/cosign-installer@v3

      - name: Verificar firma (solo imagenes construidas por ci.yml en main)
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
        run: |
          cosign verify "$IMAGE_REF" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Desplegar en la VPS app por SSM
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=devsecops-demo" "Name=tag:Role,Values=app" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          CMD="cd /opt/app && sed -i \"s|^APP_IMAGE=.*|APP_IMAGE=${IMAGE_REF}|\" .env && docker compose pull app && docker compose up -d --remove-orphans"
          jq -n --arg c "$CMD" '{commands: [$c]}' > params.json
          CMD_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --parameters file://params.json \
            --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '{Estado:Status,Salida:StandardOutputContent}' --output yaml
